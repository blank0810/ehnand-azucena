services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3001:4321"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - astro_cache:/app/.astro
      - astro_dist:/app/dist
    environment:
      NODE_ENV: development

volumes:
  node_modules:
  astro_cache:
  astro_dist:
