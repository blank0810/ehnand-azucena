<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>01 What a coding agent is · scene 4, gotchas and other agents</title>
  </head>
  <body>
    <template>
      <style>
        /* Same faces as the host; the paths resolve from index.html, where scenes are assembled. */
        @font-face { font-family: "Plex Sans"; src: url("assets/fonts/ibm-plex-sans-latin-wght-normal.woff2") format("woff2"); font-weight: 100 700; }
        @font-face { font-family: "Plex Mono"; src: url("assets/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "Plex Mono"; src: url("assets/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
        @font-face { font-family: "Plex Mono"; src: url("assets/fonts/ibm-plex-mono-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
        #root { position: absolute; inset: 0; font-family: "Plex Sans", sans-serif; color: #15191f; }
        #go-stage { position: absolute; inset: 0; }
        #go-step { position: absolute; right: 120px; top: 136px; font: 500 28px/1 "Plex Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase; color: #4e5763; }
        #go-source { position: absolute; left: 120px; top: 990px; font: 400 28px/1 "Plex Mono", monospace; color: #4e5763; }

        .go-col { position: absolute; top: 196px; }
        #go-budget { left: 120px; width: 800px; }
        #go-others { left: 1020px; width: 780px; }
        .go-title { font-weight: 620; font-size: 60px; line-height: 1.1; letter-spacing: -0.025em; }
        #go-spend { margin-top: 28px; width: 760px; font-size: 34px; line-height: 1.35; color: #4e5763; }
        #go-cmd { margin-top: 44px; }
        #go-cmd code { display: inline-block; padding: 8px 16px; background: #e8ebef; font: 500 36px/1.2 "Plex Mono", monospace; }
        #go-cmd-says { display: block; margin-top: 16px; font-size: 30px; line-height: 1.3; }

        .go-head { margin-top: 30px; padding-bottom: 14px; border-bottom: 2px solid #15191f; font: 500 28px/1 "Plex Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase; color: #4e5763; }
        .go-row { display: flex; align-items: center; height: 76px; border-bottom: 1px solid #d0d5db; font-weight: 600; font-size: 34px; letter-spacing: -0.01em; }

        #go-rule { position: absolute; left: 120px; top: 744px; width: 1680px; }
        #go-rule-line { display: block; height: 2px; background: #15191f; transform-origin: 0 50%; }
        .go-said { display: block; font-weight: 620; font-size: 56px; line-height: 1.15; letter-spacing: -0.025em; }
        #go-said-1 { margin-top: 30px; }
        #go-said-2 { color: #164bc5; }
      </style>

      <div id="root" data-composition-id="gotchas" data-width="1920" data-height="1080">
        <div id="go-stage">
          <div id="go-step">4 / 4 · Gotchas</div>

          <div id="go-budget" class="go-col">
            <h2 id="go-budget-title" class="go-title">Context is a budget</h2>
            <p id="go-spend">Every layer in this series spends some of it.</p>
            <div id="go-cmd"><code>/context</code><span id="go-cmd-says">Shows what loaded, and what each part costs</span></div>
          </div>

          <div id="go-others" class="go-col">
            <h2 id="go-others-title" class="go-title">Same loop, other agents</h2>
            <div id="go-others-head" class="go-head">Agent</div>
            <div id="go-a1" class="go-row">Codex</div>
            <div id="go-a2" class="go-row">Cursor</div>
            <div id="go-a3" class="go-row">Gemini CLI</div>
            <div id="go-a4" class="go-row">GitHub Copilot</div>
          </div>

          <div id="go-rule">
            <i id="go-rule-line"></i>
            <span id="go-said-1" class="go-said">Everyone rents the same models.</span>
            <span id="go-said-2" class="go-said">The setup around them is the part you build.</span>
          </div>

          <div id="go-source">Sources: code.claude.com/docs/en/how-claude-code-works, /context-window</div>
        </div>
      </div>

      <script>
        ;(() => {
          const V = window.__vo
          const S = V.scenes.gotchas[0]
          // When a phrase is said: its share of the line's characters, from the line's exact start.
          const at = (id, words) => {
            const [s, e, say] = V.lines[id]
            const i = words ? say.indexOf(words) : 0
            if (i < 0) throw new Error(`"${words}" is not in ${id}`)
            return s - S + (i / say.length) * (e - s)
          }
          const tl = gsap.timeline({ paused: true })
          const rise = { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }

          tl.fromTo("#go-budget-title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power4.out" }, 0.05)
          tl.fromTo("#go-source", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.3)
          tl.fromTo("#go-spend", { opacity: 0, y: 16 }, rise, at("l12", "every layer"))
          tl.fromTo("#go-cmd code", { opacity: 0, scale: 0.9, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, at("l12", "Slash context"))
          tl.fromTo("#go-cmd-says", { opacity: 0, y: 12 }, rise, at("l12", "shows what loaded"))

          tl.fromTo("#go-others-title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power4.out" }, at("l13") - 0.2)
          tl.fromTo("#go-others-head", { opacity: 0 }, { opacity: 1, duration: 0.4 }, at("l13"))
          ;[["#go-a1", "Codex"], ["#go-a2", "Cursor"], ["#go-a3", "Gemini"], ["#go-a4", "Copilot"]].forEach(([el, name]) => {
            tl.fromTo(el, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, at("l13", name))
          })

          // The closing rule: the line the whole article argues for.
          tl.fromTo("#go-rule-line", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, at("l14") - 0.3)
          tl.fromTo("#go-said-1", { opacity: 0, y: 20 }, rise, at("l14"))
          tl.fromTo("#go-said-2", { opacity: 0, y: 20 }, rise, at("l14", "The setup"))

          // The last frame holds everything on screen: it is what a viewer sees when the clip ends.
          window.__timelines["gotchas"] = tl
        })()
      </script>
    </template>
  </body>
</html>
